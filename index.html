<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>Sitio en reconstrucción</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --grad-start: #0f172a;
            --grad-end: #1e1b4b;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --accent: #4f46e5;
            --radius-lg: 2rem;
            --radius-md: 1.25rem;
            --shadow-lg: 0 25px 45px -12px rgba(0, 0, 0, 0.3);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --card-bg: rgba(15, 23, 42, 0.96);
                --text-primary: #f1f5f9;
                --text-secondary: #cbd5e1;
            }
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.03) 1.5px, transparent 1.5px);
            background-size: 2rem 2rem;
            pointer-events: none;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-lg);
            max-width: 560px;
            width: 100%;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.4s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
        }

        .icon {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 800;
            text-align: center;
            background: linear-gradient(120deg, var(--text-primary), var(--accent));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
        }

        .alert {
            background: rgba(79, 70, 229, 0.08);
            border-left: 4px solid var(--accent);
            padding: 1.25rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
        }

        .alert p {
            color: var(--text-secondary);
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .alert p:first-child {
            margin-bottom: 0.75rem;
        }

        .alert strong {
            color: var(--text-primary);
        }

        .btn {
            display: block;
            background: var(--accent);
            color: white;
            text-align: center;
            padding: 0.9rem 1.5rem;
            border-radius: 3rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: #6366f1;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <div class="icon" aria-hidden="true">🔧⚙️</div>
        <h1>En mantenimiento</h1>
        <div class="alert">
            <p><strong>⚠️ Este sitio está en reconstrucción completa.</strong> Como parte del proceso, la dirección web ha cambiado.</p>
            <p>📌 Haz clic en el botón inferior para acceder a la nueva ubicación oficial.</p>
        </div>
        <a href="https://spoo.me/oficial" class="btn" id="accessLink">Acceder al sitio renovado →</a>
    </main>
</body>
</html>
